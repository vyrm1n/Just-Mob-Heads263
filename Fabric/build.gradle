plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id 'com.gradleup.shadow' version '9.6.1'
}

repositories {
    maven { url "https://github.com/Serilum/.maven/raw/maven/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.nucleoid.xyz/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    api("com.terraformersmc:modmenu:20.0.0-beta.2") { exclude(module: "fabric-api") }

    implementation "com.natamus.collective-ml:collective-fabric:${minecraft_display_version}-${collective_version}"
    compileOnly "com.natamus.collective-ml:collective:${minecraft_display_version}-${collective_version}"
}

loom {
    def aw = project(':Common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    // mixin {
    //    defaultRefmapName.set("${mod_id}.refmap.json")
    // }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'includeInternal', 'modCompileClasspath'].each { variant -> // , 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

// The Collective jar that Serilum publishes (CurseForge/Modrinth) has its shared code relocated to
// com.natamus.collective_common_fabric, while the Maven artifact we compile against uses
// com.natamus.collective. Relocate our references so the built jar works with the published Collective.
// The com.natamus.collective.fabric.* packages are not relocated in the published jar.
jar {
    archiveClassifier = 'dev'
}

shadowJar {
    archiveClassifier = ''
    configurations = [] // bundle only this mod's own classes
    ['check', 'cmds', 'config', 'data', 'events', 'fakeplayer', 'features', 'functions', 'globalcallbacks',
     'implementations', 'networking', 'objects', 'schematic', 'services', 'translations', 'util'].each {
        relocate "com.natamus.collective.${it}", "com.natamus.collective_common_fabric.${it}"
    }
}
